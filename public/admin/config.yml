backend:
  name: github
  repo: marcusvsouza07-cmd/reflexoes-inspiracoes
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Posts"

    folder: "src/content/posts"

    create: true

    slug: "{{slug}}"

    fields:
      - {
          label: "Título",
          name: "title",
          widget: "string"
        }

      - {
          label: "Descrição",
          name: "description",
          widget: "string"
        }

      - {
          label: "Data",
          name: "date",
          widget: "datetime"
        }

      - {
          label: "Categoria",
          name: "category",
          widget: "string"
        }

      - {
          label: "Conteúdo",
          name: "body",
          widget: "markdown"
        }